services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forgeflow
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: ${FORGEFLOW_DB_PASSWORD:?FORGEFLOW_DB_PASSWORD must be set}
    volumes: [forgeflow-db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U forgeflow"], interval: 5s, timeout: 3s, retries: 20}
  api:
    build: ./backend
    environment:
      FORGEFLOW_DB_URL: jdbc:postgresql://db:5432/forgeflow
      FORGEFLOW_DB_USER: forgeflow
      FORGEFLOW_DB_PASSWORD: ${FORGEFLOW_DB_PASSWORD:?FORGEFLOW_DB_PASSWORD must be set}
      FORGEFLOW_CONTROL_ROOT: /control-unmounted
      FORGEFLOW_RUN_ROOT: /runs
      FORGEFLOW_GATEWAY_TOKEN: ${FORGEFLOW_GATEWAY_TOKEN:?FORGEFLOW_GATEWAY_TOKEN must be set}
      YOUTUBE_ORCHESTRATOR_URL: http://youtube-orchestrator:8090
    depends_on:
      db: {condition: service_healthy}
      youtube-orchestrator: {condition: service_healthy}
    volumes: [forgeflow-runs:/runs, forgeflow-targets:/targets]
  youtube-orchestrator:
    build: ./orchestrator
    environment:
      YOUTUBE_COLLECTOR_MODE: ${YOUTUBE_COLLECTOR_MODE:-demo}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"], interval: 5s, timeout: 3s, retries: 20}
    read_only: true
    tmpfs: [/tmp]
  web:
    build: ./frontend
    environment:
      FORGEFLOW_GATEWAY_TOKEN: ${FORGEFLOW_GATEWAY_TOKEN:?FORGEFLOW_GATEWAY_TOKEN must be set}
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  forgeflow-db:
  forgeflow-runs:
  forgeflow-targets:
