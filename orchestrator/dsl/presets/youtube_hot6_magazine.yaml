name: YouTube Hot 6 Magazine Pipeline
version: 1
mode: scaffold
defaults:
  region_code: KR
  category_id: "24"
  privacy_status: private
stages:
  - {name: collect_trending, uses: youtube.collect, enabled: false}
  - {name: group_similar_videos, uses: youtube.cluster, enabled: true}
  - {name: rank_videos, uses: youtube.rank, enabled: true}
  - {name: detect_hot_parts, uses: youtube.hot_part_detector, enabled: false}
  - {name: write_script, uses: magazine.script_writer, enabled: false}
  - {name: generate_sketch_images, uses: image.sketch_generator, enabled: false}
  - {name: tts_generation, uses: tts.fastapi, enabled: false}
  - {name: edit_video, uses: ffmpeg.magazine_video_edit, enabled: false}
  - {name: quality_check, uses: quality.check, enabled: true}
  - {name: upload_youtube, uses: youtube.uploader, enabled: false}
