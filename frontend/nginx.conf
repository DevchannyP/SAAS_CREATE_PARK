server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 2m;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location / { try_files $uri /index.html; }
  location /api/ {
    proxy_set_header X-ForgeFlow-Gateway "${FORGEFLOW_GATEWAY_TOKEN}";
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    proxy_send_timeout 10s;
    proxy_pass http://api:8080;
  }
  location = /actuator/health {
    proxy_set_header X-ForgeFlow-Gateway "${FORGEFLOW_GATEWAY_TOKEN}";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_pass http://api:8080;
  }
  location /actuator/ { return 404; }
}
